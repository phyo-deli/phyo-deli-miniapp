<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-36">

    <header class="bg-red-600 text-white p-4 text-center font-bold text-lg shadow-md sticky top-0 z-50 flex justify-between items-center">

        </div>

                </h3>

                    <p class="text-gray-400 text-center py-2 text-xs">ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>
                </div>
            </div>

            <!-- VIEW 1: MENU -->

                    <div>

                    </div>

                    <div id="normal-schedule-container" class="hidden bg-blue-50 p-3 rounded-xl border border-blue-200 space-y-1">

                        <select id="shoppingNormalScheduleSelect" class="w-full p-2.5 border rounded-xl bg-white font-bold text-gray-800 focus:ring-2 focus:ring-blue-400 outline-none text-xs sm:text-sm">
                            <option value="batch1" data-cutoff="08:30">မနက် ၈:၃၀ အော်ဒါပိတ် - ၉:၀၀ စပို့ (ရောက်ရှိချိန်: ၉:၀၀ မှ ၁၁:၀၀ အတွင်း)</option>

                            <option value="batch3" data-cutoff="12:30">နေ့လယ် ၁၂:၃၀ အော်ဒါပိတ် - ၁:၀၀ စပို့ (ရောက်ရှိချိန်: ၁:၀၀ မှ ၃:၀၀ အတွင်း)</option>
                            <option value="batch4" data-cutoff="14:30">ညနေ ၂:၃၀ အော်ဒါပိတ် - ၃:၀၀ စပို့ (ရောက်ရှိချိန်: ၃:၀၀ မှ ၅:၀၀ အတွင်း)</option>

                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">အသေးစိတ် လိပ်စာ / မှတ်ချက်</label>

                    </div>

                            <label class="block text-xs font-semibold text-gray-600">တည်နေရာ (Lat, Long သို့မဟုတ် Google Map Link)</label>

                        </div>
                        <input type="text" id="cust-location" placeholder="Google Map Link (သို့) 16.2891, 97.6321..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
                    </div>
                </div>
            </div>
        </div>

        <!-- ================= SECTION 2: TRACK ORDER VIEW ================= -->
        <div id="section-track" class="hidden space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
                <h3 class="font-bold text-base text-gray-700 border-b pb-2">📦 အော်ဒါအခြေအနေ စစ်ဆေးရန်</h3>

                    <label class="block text-xs font-semibold text-gray-600 mb-1">သင်၏ ဖုန်းနံပါတ်ထည့်ပါ</label>
                    <div class="flex gap-2">
                        <input type="tel" id="track-phone" placeholder="09xxxxxxxxx" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
                        <button onclick="trackOrder()" class="bg-red-600 text-white px-4 py-2.5 rounded-lg font-bold text-sm hover:bg-red-700">ရှာမည်</button>
                    </div>
                </div>
                <div id="track-result" class="space-y-3 mt-4">
                    <p class="text-gray-400 text-center text-xs py-4">ဖုန်းနံပါတ်ထည့်၍ ရှာဖွေပါ။</p>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer / Floating Navigation Bar -->
    <div id="order-footer" class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl max-w-md mx-auto flex justify-between items-center z-50 rounded-t-2xl">
        <div>
            <p class="text-xs text-gray-500">စုစုပေါင်း ကျသင့်ငွေ</p>
            <p id="total-price" class="font-bold text-lg text-red-600">0 ကျပ်</p>
        </div>
        
        <button id="btn-to-checkout" onclick="switchView('checkout')" class="bg-red-600 text-white px-5 py-2.5 rounded-xl font-bold shadow-md hover:bg-red-700 text-sm transition">
            အော်ဒါကြည့်မည် 🛒
        </button>

        <button id="btn-submit-order" onclick="submitOrder()" class="hidden bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-green-700 text-sm transition">
            အော်ဒါအတည်ပြုမည်
        </button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyYiryNE18JMTTmXfg-Y7jSKa6slWf_08YyIJxefCJ0Wn9gVRFT_kilYFFWo_SZDuMSgg/exec"; 

        let products = [];
        let wards = [];
        let cart = {};
        let currentSubtotal = 0;
        let currentDeliveryFee = 0;

        const shopWard = 'မြိုင်သာယာရပ်ကွက်';
        const shopZone = 'B';

        const wardZones = {
            'A': ['မန္တလေးရပ်ကွက်','ဖက်တန်းရပ်ကွက်','ရွှေတောင်ရပ်ကွက်','စစ်ကဲကုန်းရပ်ကွက်','မရမ်းကုန်းရပ်ကွက်','ပန်းပဲတန်းရပ်ကွက်','ဘိုကုန်းရပ်ကွက်','မောင်ငံရပ်ကွက်'],
            'B': ['ကွင်းကျောင်းရပ်ကွက်','သီရီမြိုင်ရပ်ကွက်','သီရီမင်္ဂလာရပ်ကွက်','ဈေးကြိုရပ်ကွက်','မြိုင်သာယာရပ်ကွက်','ကျွဲခြံကုန်းရပ်ကွက်','ငန်းတေးရပ်ကွက်','ဇေယျာမြိုင်ရပ်ကွက်'],
            'C': ['အောက်ကျင်းရပ်ကွက်','ရွှေမြိုင်သီရီရပ်ကွက်','ဇေယျာချမ်းမြေ့ရပ်ကွက်','သာယာအေးရပ်ကွက်','လှိုင်ရပ်ကွက်','ရွှေပြည်အေးရပ်ကွက်','မြေနီကုန်းရပ်ကွက်'],
            'D': ['မုပွန်ရပ်ကွက်','ကျောက်တန်းရပ်ကွက်','ဂွေးကုန်းရပ်ကွက်','စမ်းကြီးရပ်ကွက်','နောင်ခရီရပ်ကွက်'],
            'E': ['ကြာအင်းရပ်ကွက်','ဖားအောက်ရပ်ကွက်','ကော့ခမယ်ရပ်ကွက်','ရိုးဂိုးရပ်ကွက်'],
            'F': ['ခြောက်မိုင်ရပ်ကွက်','မင်းရွာရပ်ကွက်','မုရောင်းရပ်ကွက်','သွေးသောက်ရပ်ကွက်'],
            'G': ['စက်မှုဇုန်ရပ်ကွက်','ညောင်ပင်ဆိပ်ရပ်ကွက်']
        };

        const deliveryRates = {
            "A-B": { express: 4500, normal: 3000 }, "B-A": { express: 4500, normal: 3000 },
            "A-C": { express: 4500, normal: 3000 }, "C-A": { express: 4500, normal: 3000 },
            "A-D": { express: 5500, normal: 3500 }, "D-A": { express: 5500, normal: 3500 },
            "A-E": { express: 9000, normal: 4500 }, "E-A": { express: 9000, normal: 4500 },
            "A-F": { express: 9000, normal: 4500 }, "F-A": { express: 9000, normal: 4500 },
            "A-G": { express: 9000, normal: 4500 }, "G-A": { express: 9000, normal: 4500 },
            "B-E": { express: 6500, normal: 4000 }, "E-B": { express: 6500, normal: 4000 },
            "B-F": { express: 6500, normal: 4000 }, "F-B": { express: 6500, normal: 4000 },
            "B-G": { express: 6500, normal: 4000 }, "G-B": { express: 6500, normal: 4000 },
            "C-D": { express: 6500, normal: 4000 }, "D-C": { express: 6500, normal: 4000 },
            "C-E": { express: 9000, normal: 4500 }, "E-C": { express: 9000, normal: 4500 },
            "C-F": { express: 9000, normal: 4500 }, "F-C": { express: 9000, normal: 4500 },
            "C-G": { express: 9000, normal: 4500 }, "G-C": { express: 9000, normal: 4500 },
            "D-E": { express: 5500, normal: 3500 }, "E-D": { express: 5500, normal: 3500 },
            "D-F": { express: 9000, normal: 4500 }, "F-D": { express: 9000, normal: 4500 },
            "D-G": { express: 9000, normal: 4500 }, "G-D": { express: 9000, normal: 4500 },
            "E-F": { express: 9000, normal: 4500 }, "F-E": { express: 9000, normal: 4500 },
            "E-G": { express: 9000, normal: 4500 }, "G-E": { express: 9000, normal: 4500 },
            "F-G": { express: 6500, normal: 4000 }, "G-F": { express: 6500, normal: 4000 }
        };

        function switchTab(tab) {
            const secOrder = document.getElementById('section-order');
            const secTrack = document.getElementById('section-track');
            const tabOrder = document.getElementById('tab-order');
            const tabTrack = document.getElementById('tab-track');
            const footer = document.getElementById('order-footer');

            if (tab === 'track') {
                secOrder.classList.add('hidden');
                secTrack.classList.remove('hidden');
                tabTrack.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition";
                tabOrder.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 transition";
                footer.classList.add('hidden');
            } else {
                secTrack.classList.add('hidden');
                secOrder.classList.remove('hidden');
                tabOrder.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-red-600 text-white transition";
                tabTrack.className = "flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 transition";
                footer.classList.remove('hidden');
            }
        }

        async function trackOrder() {
    const phone = document.getElementById('track-phone').value.trim();
    const resultDiv = document.getElementById('track-result');

    if (!phone) {
        alert("ကျေးဇူးပြု၍ ဖုန်းနံပါတ်ထည့်ပါ။");
        return;
    }

    resultDiv.innerHTML = `<p class="text-center text-gray-400 py-4 text-xs">ရှာဖွေနေပါသည်...</p>`;

    try {
        let res = await fetch(`${API_URL}?action=track&phone=${phone}`);
        let data = await res.json();
        let orders = data.orders || [];

        if (orders.length === 0) {
            resultDiv.innerHTML = `<p class="text-center text-red-500 py-4 text-xs">ဤဖုန်းနံပါတ်ဖြင့် အော်ဒါမတွေ့ရှိပါ။</p>`;
            return;
        }

        resultDiv.innerHTML = orders.reverse().map(o => {
            // Google Sheet ထဲက Column Key တွေကို အလိုအလျောက် ရှာဖွေပေးမည့် Helper Function
            function findVal(keywords) {
                for (let k in o) {
                    let lk = k.toLowerCase();
                    if (keywords.some(kw => lk.includes(kw))) {
                        let val = o[k];
                        if (val !== undefined && val !== null && val !== '') return val;
                    }
                }
                return 0;
            }

            let sub = findVal(['subtotal', 'ကုန်ဖိုး']);
            let del = findVal(['delivery', 'ဒလီ', 'ပို့ဆောင်ခ']);
            let tot = findVal(['total', 'စုစုပေါင်း']);

            return `
                <div class="bg-gray-50 p-3 rounded-xl border space-y-2 text-xs shadow-xs">
                    <div class="flex justify-between items-center border-b pb-1">
                        <span class="font-bold text-gray-600">🕒 ${new Date(o.Timestamp || Date.now()).toLocaleString()}</span>
                        <span class="px-2 py-0.5 rounded-full font-bold ${getBadgeColor(o.Status)}">${o.Status || 'လက်ခံရရှိထားပါသည်'}</span>
                    </div>
                    <div><strong>ပစ္စည်းများ:</strong> ${o.Items || ''}</div>
                    <div><strong>ကုန်ဖိုး:</strong> ${Number(sub || 0).toLocaleString()} ကျပ်</div>
                    <div><strong>ပို့ဆောင်ခ:</strong> ${Number(del || 0).toLocaleString()} ကျပ်</div>
                    <div class="flex justify-between font-bold text-red-600 pt-1 border-t">
                        <span>စုစုပေါင်းငွေ:</span>
            <span>${Number(o.TotalAmount || o['Total Amount'] || 0).toLocaleString()} ကျပ်</span>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error(err);
        resultDiv.innerHTML = `<p class="text-center text-red-500 py-4 text-xs">အချက်အလက် ရယူရာတွင် အမှားအယွင်းရှိပါသည်။</p>`;
    }
}

        function getBadgeColor(status) {
            if (!status) return 'bg-yellow-100 text-yellow-700';
            if (status.includes('ပြင်ဆင်')) return 'bg-blue-100 text-blue-700';
            if (status.includes('ပို့ဆောင်')) return 'bg-purple-100 text-purple-700';
            if (status.includes('ပြီးဆုံး') || status.includes('ရောက်')) return 'bg-green-100 text-green-700';
            return 'bg-gray-200 text-gray-700';
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(6);
                        const lng = position.coords.longitude.toFixed(6);
                        document.getElementById('cust-location').value = `${lat}, ${lng}`;
                        alert("တည်နေရာကို အောင်မြင်စွာ ရယူပြီးပါပြီ!");
                    },
                    (error) => {
                        alert("တည်နေရာ ရယူ၍ မရပါ။ GPS ဖွင့်ထားခြင်း ရှိမရှိ စစ်ဆေးပါ။");
                    }
                );
            } else {
                alert("သင့်ဖုန်းတွင် Location ရယူခြင်းကို မထောက်ပံ့ပါ။");
            }
        }

        function checkAdjacent(pWard, dWard) {
            const pairs = [
                ['မောင်ငံရပ်ကွက်', 'ကွင်းကျောင်းရပ်ကွက်'],
                ['မန္တလေးရပ်ကွက်', 'အောက်ကျင်းရပ်ကွက်'],
                ['မြေနီကုန်းရပ်ကွက်', 'ဇေယျာမြိုင်ရပ်ကွက်'],
                ['သီရီမြိုင်ရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['သီရီမင်္ဂလာရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['ဈေးကြိုရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['စမ်းကြီးရပ်ကွက်', 'စမ်းကြီးရပ်ကွက်']
            ];
            return pairs.some(pair => (pair[0] === pWard && pair[1] === dWard) || (pair[0] === dWard && pair[1] === pWard));
        }

        function toggleServiceOptions() {
            const serviceType = document.getElementById('service-select').value;
            const scheduleContainer = document.getElementById('normal-schedule-container');
            
            if (serviceType === 'normal') {
                scheduleContainer.classList.remove('hidden');
            } else {
                scheduleContainer.classList.add('hidden');
            }
            calculateTotal();
        }

        function switchView(targetView) {
            const menuView = document.getElementById('view-menu');
            const checkoutView = document.getElementById('view-checkout');
            const btnToCheckout = document.getElementById('btn-to-checkout');
            const btnSubmitOrder = document.getElementById('btn-submit-order');
            const backBtn = document.getElementById('back-btn');

            if (targetView === 'checkout') {
                if (Object.keys(cart).length === 0) {
                    alert("ကျေးဇူးပြု၍ မီနူးပစ္စည်း အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ။");
                    return;
                }
                menuView.classList.add('hidden');
                checkoutView.classList.remove('hidden');
                btnToCheckout.classList.add('hidden');
                btnSubmitOrder.classList.remove('hidden');
                backBtn.classList.remove('hidden');
                window.scrollTo(0, 0);
            } else {
                checkoutView.classList.add('hidden');
                menuView.classList.remove('hidden');
                btnSubmitOrder.classList.add('hidden');
                btnToCheckout.classList.remove('hidden');
                backBtn.classList.add('hidden');
            }
        }

        async function fetchData() {
            try {
                let resProd = await fetch(API_URL);
                let dataProd = await resProd.json();
                products = dataProd.products || [];
                renderProducts();
                renderWards();
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            if (!products || products.length === 0) {
                list.innerHTML = `<p class="col-span-2 text-center text-gray-400 py-4">မီနူးများ ရယူနေပါသည်...</p>`;
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="bg-gray-50 p-2.5 rounded-xl border flex flex-col justify-between hover:shadow-md transition">
                    <img src="${p.ImageURL}" class="w-full h-28 object-cover rounded-lg mb-2">
                    <h3 class="font-semibold text-xs text-gray-800 line-clamp-1">${p.ItemName}</h3>
                    <p class="text-red-600 font-bold text-xs my-1">${p.Price} ကျပ်</p>
                    <div class="flex items-center justify-between bg-white border rounded-lg p-1 shadow-xs">
                        <button onclick="updateQty('${p.ItemID}', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded-md font-bold text-gray-600 hover:bg-gray-200">-</button>
                        <span id="qty-${p.ItemID}" class="text-xs font-bold">${cart[p.ItemID] ? cart[p.ItemID].qty : 0}</span>
                        <button onclick="updateQty('${p.ItemID}', 1)" class="w-6 h-6 flex items-center justify-center bg-red-500 text-white rounded-md font-bold hover:bg-red-600">+</button>
                    </div>
                </div>
            `).join('');
        }

        function renderWards() {
            const select = document.getElementById('ward-select');
            let html = '<option value="">ရပ်ကွက် ရွေးပါ...</option>';
            for (let z in wardZones) {
                wardZones[z].forEach(w => {
                    html += `<option value="${w}" data-zone="${z}">${w} (Zone ${z})</option>`;
                });
            }
            select.innerHTML = html;
        }

        function updateQty(itemID, change) {
            const product = products.find(p => p.ItemID == itemID);
            if (!product) return;

            if (!cart[itemID]) {
                if (change > 0) {
                    cart[itemID] = { ...product, qty: 1 };
                }
            } else {
                cart[itemID].qty += change;
                if (cart[itemID].qty <= 0) {
                    delete cart[itemID];
                }
            }

            const qtySpan = document.getElementById(`qty-${itemID}`);
            if (qtySpan) {
                qtySpan.innerText = cart[itemID] ? cart[itemID].qty : 0;
            }

            calculateTotal();
        }

        function getZone(wardName) {
            for (let z in wardZones) {
                if (wardZones[z].includes(wardName)) return z;
            }
            return 'B';
        }

        function calculateTotal() {
            const cartList = document.getElementById('cart-items-list');
            const cartBadge = document.getElementById('cart-count-badge');
            const cartKeys = Object.keys(cart);

            cartBadge.innerText = `${cartKeys.length} မျိုး`;

            currentSubtotal = 0;
            if (cartKeys.length > 0) {
                cartList.innerHTML = cartKeys.map(key => {
                    let item = cart[key];
                    let itemTotal = Number(item.Price) * item.qty;
                    currentSubtotal += itemTotal;
                    return `
                        <div class="flex justify-between items-center border-b pb-1.5 text-xs">
                            <div>
                                <span class="font-medium text-gray-800">${item.ItemName}</span>
                                <span class="text-gray-400 ml-1">(${item.Price} x ${item.qty})</span>
                            </div>
                            <span class="font-bold text-red-600">${itemTotal.toLocaleString()} ကျပ်</span>
                        </div>
                    `;
                }).join('');
            } else {
                cartList.innerHTML = `<p class="text-gray-400 text-center py-2 text-xs">ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>`;
            }

            currentDeliveryFee = 0;
            const wardSelect = document.getElementById('ward-select');
            const selectedOption = wardSelect.options[wardSelect.selectedIndex];
            const serviceType = document.getElementById('service-select').value;

            if (selectedOption && selectedOption.value && serviceType) {
                const customerWard = selectedOption.value;
                const customerZone = selectedOption.getAttribute('data-zone') || getZone(customerWard);
                const isAdj = checkAdjacent(shopWard, customerWard);

                if (shopZone === customerZone || isAdj) {
                    if (serviceType === 'express') currentDeliveryFee = 3500;
                    else currentDeliveryFee = 2500;
                } else {
                    let key1 = `${shopZone}-${customerZone}`;
                    let key2 = `${customerZone}-${shopZone}`;
                    let rateObj = deliveryRates[key1] || deliveryRates[key2];
                    if (rateObj) {
                        currentDeliveryFee = rateObj[serviceType] || 3000;
                    } else {
                        currentDeliveryFee = 4000;
                    }
                }
            }

            if (currentSubtotal > 0 && selectedOption.value && serviceType) {
                cartList.innerHTML += `
                    <div class="flex justify-between items-center pt-1 text-gray-500 text-xs font-semibold">
                        <span>🚚 ပို့ဆောင်ခ (${selectedOption.value})</span>
                        <span class="font-bold text-gray-700">${currentDeliveryFee.toLocaleString()} ကျပ်</span>
                    </div>
                `;
            }

            let grandTotal = currentSubtotal + (currentSubtotal > 0 && selectedOption.value && serviceType ? currentDeliveryFee : 0);
            document.getElementById('total-price').innerText = grandTotal.toLocaleString() + " ကျပ်";
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const ward = document.getElementById('ward-select').value;
            const service = document.getElementById('service-select').value;
            const scheduleSelect = document.getElementById('shoppingNormalScheduleSelect');
            const scheduleText = (service === 'normal' && scheduleSelect) ? scheduleSelect.options[scheduleSelect.selectedIndex].text : "အမြန်ပို့ (ချက်ချင်း)";
            const location = document.getElementById('cust-location').value.trim();
            const address = document.getElementById('cust-address').value.trim();

            if(!name) { alert("ကျေးဇူးပြု၍ ဝယ်သူအမည် ဖြည့်စွက်ပါ။"); document.getElementById('cust-name').focus(); return; }
            if(!phone) { alert("ကျေးဇူးပြု၍ ဖုန်းနံပါတ် ဖြည့်စွက်ပါ။"); document.getElementById('cust-phone').focus(); return; }
            if(!ward) { alert("ကျေးဇူးပြု၍ သင့်ရပ်ကွက်ကို ရွေးချယ်ပါ။"); document.getElementById('ward-select').focus(); return; }
            if(!service) { alert("ကျေးဇူးပြု၍ ပို့ဆောင်မည့် အမျိုးအစား ကို ရွေးချယ်ပါ။"); document.getElementById('service-select').focus(); return; }
            if(Object.keys(cart).length === 0) { alert("ကျေးဇူးပြု၍ မီနူးပစ္စည်း အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ။"); switchView('menu'); return; }

            let totalAmount = currentSubtotal + currentDeliveryFee;

            let orderData = {
                name: name,
                phone: phone,
                ward: ward,
                service: `${service === 'normal' ? 'ပုံမှန်ပို့ (' + scheduleText + ')' : 'အမြန်ပို့'}`,
                location: location,
                address: address,
                items: Object.values(cart).map(i => `${i.ItemName} (${i.Price}x${i.qty})`),
                subtotal: currentSubtotal,
                deliveryFee: currentDeliveryFee,
                total: totalAmount
            };

            try {
                let response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(orderData)
                });
                let result = await response.json();
                
                // ဒေတာ အောင်မြင်စွာ ဝင်သွားပါက
                alert("အော်ဒါအောင်မြင်စွာ တင်ပြီးပါပြီ!");
                location.reload();

            } catch (err) {
                console.error(err);
                // JSON parse error တက်ရင်တောင် Sheet ထဲ Data ရောက်သွားပြီဆိုရင် အောင်မြင်တယ်လို့ ယူဆပြီး reload လုပ်ပေးရန်
                alert("အော်ဒါအောင်မြင်စွာ တင်ပြီးပါပြီ!");
                location.reload();
            }
        }

        fetchData();
    </script>
</body>
</html>
