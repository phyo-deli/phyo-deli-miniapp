<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phyo Deli - Order App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-36">

    <!-- Header -->
    <header class="bg-red-600 text-white p-4 text-center font-bold text-lg shadow-md sticky top-0 z-50">
        🍔 Phyo Deli Order App
    </header>

    <div class="p-4 max-w-md mx-auto space-y-4">
        
        <!-- 1. Menu List Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <h2 class="font-bold text-base mb-3 text-red-600 border-b pb-2">🍜 ရနိုင်သော မီနူးများ</h2>
            <div id="product-list" class="grid grid-cols-2 gap-3">
                <!-- Products will load here dynamically -->
            </div>
        </div>

        <!-- 2. Cart Items Summary Section -->
        <div class="bg-white p-4 rounded-xl shadow-sm border">
            <h3 class="font-bold text-base mb-2 text-gray-700 border-b pb-2">🛒 ရွေးချယ်ထားသော ခြင်းတောင်း</h3>
            <div id="cart-items-list" class="space-y-2 text-sm">
                <p class="text-gray-400 text-center py-2">ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>
            </div>
        </div>

        <!-- 3. Customer Info & Delivery Selection -->
        <div class="bg-white p-4 rounded-xl shadow-sm border space-y-3">
            <h3 class="font-bold text-base text-gray-700 border-b pb-2">📍 ပို့ဆောင်ရမည့် လိပ်စာနှင့် အချက်အလက်</h3>
            
            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ဝယ်သူအမည်</label>
                <input type="text" id="cust-name" placeholder="အမည်ထည့်ပါ..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ဖုန်းနံပါတ်</label>
                <input type="tel" id="cust-phone" placeholder="09xxxxxxxxx" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">သင့်ရပ်ကွက်ကို ရွေးပါ</label>
                <select id="ward-select" onchange="calculateTotal()" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
                    <option value="">ရပ်ကွက် ရွေးပါ...</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">ပို့ဆောင်မည့် အမျိုးအစား</label>
                <select id="service-select" onchange="calculateTotal()" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition">
                    <option value="normal">ပုံမှန်ပို့</option>
                    <option value="express">အမြန်ပို့</option>
                    <option value="slow">အနှေးပို့</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-600 mb-1">အသေးစိတ် လိပ်စာ / မှတ်ချက်</label>
                <textarea id="cust-address" placeholder="အိမ်နံပါတ်၊ လမ်းနာမည်..." class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition" rows="2"></textarea>
            </div>
        </div>
    </div>

    <!-- Footer / Cart Summary -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-2xl max-w-md mx-auto flex justify-between items-center z-50 rounded-t-2xl">
        <div>
            <p class="text-xs text-gray-500">ပစ္စည်းဖိုး + ပို့ဆောင်ခ</p>
            <p id="total-price" class="font-bold text-lg text-red-600">0 ကျပ်</p>
        </div>
        <button onclick="submitOrder()" class="bg-green-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-md hover:bg-green-700 text-sm transition">
            အော်ဒါတင်မည်
        </button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwJskAMJRaqbVmPT0K8MtbTh7j5NGYbUWO2Ov0eXvD3vVei36FcQoY877010syD9oHzNw/exec"; 

        let products = [];
        let wards = [];
        let cart = {};

        const shopWard = 'မြိုင်သာယာရပ်ကွက်';
        const shopZone = 'B';

        const wardZones = {
            'A': ['မန္တလေးရပ်ကွက်','ဖက်တန်းရပ်ကွက်','ရွှေတောင်ရပ်ကွက်','စစ်ကဲကုန်းရပ်ကွက်','မရမ်းကုန်းရပ်ကွက်','ပန်းပဲတန်းရပ်ကွက်','ဘိုကုန်းရပ်ကွက်','မောင်ငံရပ်ကွက်'],
            'B': ['ကွင်းကျောင်းရပ်ကွက်','သီရီမြိုင်ရပ်ကွက်','သီရီမင်္ဂလာရပ်ကွက်','ဈေးကြိုရပ်ကွက်','မြိုင်သာယာရပ်ကွက်','ကျွဲခြံကုန်းရပ်ကွက်','ငန်းတေးရပ်ကွက်','ဇေယျာမြိုင်ရပ်ကွက်'],
            'C': ['အောက်ကျင်းရပ်ကွက်','ရွှေမြိုင်သီရီရပ်ကွက်','ဇေယျာချမ်းမြေ့ရပ်ကွက်','သာယာအေးရပ်ကွက်','လှိုင်ရပ်ကွက်','ရွှေပြည်အေးရပ်ကွက်','မြေနီကုန်းရပ်ကွက်'],
            'D': ['မုပွန်ရပ်ကွက်','ကျောက်တန်းရပ်ကွက်','ဂွေးကုန်းရပ်ကွက်','စမ်းကြီးရပ်ကွက်','နောင်ခရီရပ်ကွက်'],
            'E': ['ကြာအင်းရပ်ကွက်','ဖားအောက်ရပ်ကွက်','ကော့ခမယ်ရပ်ကွက်','ရိုးဂိုးရပ်ကွက်'],
            'F': ['ခြောက်မိုင်ရပ်ကွက်','မင်းရွာရပ်ကွက်','မုရောင်းရပ်ကွက်','သွေးသောက်ရပ်ကွက်'],
            'G': ['စက်မှုဇုန်ရပ်ကွက်','ညောင်ပင်ဆိပ်ရပ်ကွက်']
        };

        const deliveryRates = {
            "A-B": { express: 4500, normal: 3000, slow: 2000 }, "B-A": { express: 4500, normal: 3000, slow: 2000 },
            "A-C": { express: 4500, normal: 3000, slow: 2000 }, "C-A": { express: 4500, normal: 3000, slow: 2000 },
            "A-D": { express: 5500, normal: 3500, slow: 2500 }, "D-A": { express: 5500, normal: 3500, slow: 2500 },
            "A-E": { express: 9000, normal: 4500, slow: 3500 }, "E-A": { express: 9000, normal: 4500, slow: 3500 },
            "A-F": { express: 9000, normal: 4500, slow: 3500 }, "F-A": { express: 9000, normal: 4500, slow: 3500 },
            "A-G": { express: 9000, normal: 4500, slow: 3500 }, "G-A": { express: 9000, normal: 4500, slow: 3500 },
            "B-E": { express: 6500, normal: 4000, slow: 3000 }, "E-B": { express: 6500, normal: 4000, slow: 3000 },
            "B-F": { express: 6500, normal: 4000, slow: 3000 }, "F-B": { express: 6500, normal: 4000, slow: 3000 },
            "B-G": { express: 6500, normal: 4000, slow: 3000 }, "G-B": { express: 6500, normal: 4000, slow: 3000 },
            "C-D": { express: 6500, normal: 4000, slow: 3000 }, "D-C": { express: 6500, normal: 4000, slow: 3000 },
            "C-E": { express: 9000, normal: 4500, slow: 3500 }, "E-C": { express: 9000, normal: 4500, slow: 3500 },
            "C-F": { express: 9000, normal: 4500, slow: 3500 }, "F-C": { express: 9000, normal: 4500, slow: 3500 },
            "C-G": { express: 9000, normal: 4500, slow: 3500 }, "G-C": { express: 9000, normal: 4500, slow: 3500 },
            "D-E": { express: 5500, normal: 3500, slow: 2500 }, "E-D": { express: 5500, normal: 3500, slow: 2500 },
            "D-F": { express: 9000, normal: 4500, slow: 3500 }, "F-D": { express: 9000, normal: 4500, slow: 3500 },
            "D-G": { express: 9000, normal: 4500, slow: 3500 }, "G-D": { express: 9000, normal: 4500, slow: 3500 },
            "E-F": { express: 9000, normal: 4500, slow: 3500 }, "F-E": { express: 9000, normal: 4500, slow: 3500 },
            "E-G": { express: 9000, normal: 4500, slow: 3500 }, "G-E": { express: 9000, normal: 4500, slow: 3500 },
            "F-G": { express: 6500, normal: 4000, slow: 3000 }, "G-F": { express: 6500, normal: 4000, slow: 3000 }
        };

        function checkAdjacent(pWard, dWard) {
            const pairs = [
                ['မောင်ငံရပ်ကွက်', 'ကွင်းကျောင်းရပ်ကွက်'],
                ['မန္တလေးရပ်ကွက်', 'အောက်ကျင်းရပ်ကွက်'],
                ['မြေနီကုန်းရပ်ကွက်', 'ဇေယျာမြိုင်ရပ်ကွက်'],
                ['သီရီမြိုင်ရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['သီရီမင်္ဂလာရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['ဈေးကြိုရပ်ကွက်', 'မုပွန်ရပ်ကွက်'],
                ['စမ်းကြီးရပ်ကွက်', 'စမ်းကြီးရပ်ကွက်']
            ];
            return pairs.some(pair => (pair[0] === pWard && pair[1] === dWard) || (pair[0] === dWard && pair[1] === pWard));
        }

        async function fetchData() {
            try {
                let resProd = await fetch(API_URL);
                let dataProd = await resProd.json();
                products = dataProd.products || [];
                renderProducts();
                renderWards();
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            if (!products || products.length === 0) {
                list.innerHTML = `<p class="col-span-2 text-center text-gray-400 py-4">မီနူးများ ရယူနေပါသည်...</p>`;
                return;
            }
            list.innerHTML = products.map(p => `
                <div class="bg-gray-50 p-2.5 rounded-xl border flex flex-col justify-between hover:shadow-md transition">
                    <img src="${p.ImageURL}" class="w-full h-28 object-cover rounded-lg mb-2">
                    <h3 class="font-semibold text-xs text-gray-800 line-clamp-1">${p.ItemName}</h3>
                    <p class="text-red-600 font-bold text-xs my-1">${p.Price} ကျပ်</p>
                    <div class="flex items-center justify-between bg-white border rounded-lg p-1 shadow-xs">
                        <button onclick="updateQty('${p.ItemID}', -1)" class="w-6 h-6 flex items-center justify-center bg-gray-100 rounded-md font-bold text-gray-600 hover:bg-gray-200">-</button>
                        <span id="qty-${p.ItemID}" class="text-xs font-bold">${cart[p.ItemID] ? cart[p.ItemID].qty : 0}</span>
                        <button onclick="updateQty('${p.ItemID}', 1)" class="w-6 h-6 flex items-center justify-center bg-red-500 text-white rounded-md font-bold hover:bg-red-600">+</button>
                    </div>
                </div>
            `).join('');
        }

        function renderWards() {
            const select = document.getElementById('ward-select');
            let html = '<option value="">ရပ်ကွက် ရွေးပါ...</option>';
            for (let z in wardZones) {
                wardZones[z].forEach(w => {
                    html += `<option value="${w}" data-zone="${z}">${w} (Zone ${z})</option>`;
                });
            }
            select.innerHTML = html;
        }

        function updateQty(itemID, change) {
            const product = products.find(p => p.ItemID == itemID);
            if (!product) return;

            if (!cart[itemID]) {
                if (change > 0) {
                    cart[itemID] = { ...product, qty: 1 };
                }
            } else {
                cart[itemID].qty += change;
                if (cart[itemID].qty <= 0) {
                    delete cart[itemID];
                }
            }

            const qtySpan = document.getElementById(`qty-${itemID}`);
            if (qtySpan) {
                qtySpan.innerText = cart[itemID] ? cart[itemID].qty : 0;
            }

            calculateTotal();
        }

        function getZone(wardName) {
            for (let z in wardZones) {
                if (wardZones[z].includes(wardName)) return z;
            }
            return 'B';
        }

        function calculateTotal() {
            const cartList = document.getElementById('cart-items-list');
            const cartKeys = Object.keys(cart);

            let subtotal = 0;
            if (cartKeys.length > 0) {
                cartList.innerHTML = cartKeys.map(key => {
                    let item = cart[key];
                    let itemTotal = Number(item.Price) * item.qty;
                    subtotal += itemTotal;
                    return `
                        <div class="flex justify-between items-center border-b pb-1.5 text-xs">
                            <div>
                                <span class="font-medium">${item.ItemName}</span>
                                <span class="text-gray-400 ml-1">(${item.Price} x ${item.qty})</span>
                            </div>
                            <span class="font-bold text-red-600">${itemTotal.toLocaleString()} ကျပ်</span>
                        </div>
                    `;
                }).join('');
            } else {
                cartList.innerHTML = `<p class="text-gray-400 text-center py-2 text-xs">ခြင်းတောင်းထဲတွင် ပစ္စည်းမရှိသေးပါ။</p>`;
            }

            let deliveryFee = 0;
            const wardSelect = document.getElementById('ward-select');
            const selectedOption = wardSelect.options[wardSelect.selectedIndex];
            const serviceType = document.getElementById('service-select').value;

            if (selectedOption && selectedOption.value) {
                const customerWard = selectedOption.value;
                const customerZone = selectedOption.getAttribute('data-zone') || getZone(customerWard);
                const isAdj = checkAdjacent(shopWard, customerWard);

                if (shopZone === customerZone || isAdj) {
                    if (serviceType === 'express') deliveryFee = 3500;
                    else if (serviceType === 'normal') deliveryFee = 2500;
                    else deliveryFee = 1500;
                } else {
                    let key1 = `${shopZone}-${customerZone}`;
                    let key2 = `${customerZone}-${shopZone}`;
                    let rateObj = deliveryRates[key1] || deliveryRates[key2];
                    if (rateObj) {
                        deliveryFee = rateObj[serviceType] || 3000;
                    } else {
                        deliveryFee = 4000;
                    }
                }
            }

            if (subtotal > 0 && selectedOption.value) {
                cartList.innerHTML += `
                    <div class="flex justify-between items-center pt-1 text-gray-500 text-xs">
                        <span>ပို့ဆောင်ခ (${selectedOption.value})</span>
                        <span class="font-bold">${deliveryFee.toLocaleString()} ကျပ်</span>
                    </div>
                `;
            }

            let grandTotal = subtotal + (subtotal > 0 && selectedOption.value ? deliveryFee : 0);
            document.getElementById('total-price').innerText = grandTotal.toLocaleString() + " ကျပ်";
        }

        async function submitOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const ward = document.getElementById('ward-select').value;
            const service = document.getElementById('service-select').value;
            const address = document.getElementById('cust-address').value.trim();

            if(!name || !phone || !ward) {
                alert("ကျေးဇူးပြု၍ ဝယ်သူအမည်၊ ဖုန်းနံပါတ်နှင့် ရပ်ကွက်ကို ဖြည့်စွက်ပါ");
                return;
            }
            if(Object.keys(cart).length === 0) {
                alert("ကျေးဇူးပြု၍ မီနူးပစ္စည်း အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ");
                return;
            }

            let subtotal = Object.values(cart).reduce((sum, item) => sum + (Number(item.Price) * item.qty), 0);
            let deliveryFee = 0;
            const wardSelect = document.getElementById('ward-select');
            const selectedOption = wardSelect.options[wardSelect.selectedIndex];
            const customerZone = selectedOption.getAttribute('data-zone') || getZone(ward);
            const isAdj = checkAdjacent(shopWard, ward);

            if (shopZone === customerZone || isAdj) {
                if (service === 'express') deliveryFee = 3500;
                else if (service === 'normal') deliveryFee = 2500;
                else deliveryFee = 1500;
            } else {
                let key1 = `${shopZone}-${customerZone}`;
                let key2 = `${customerZone}-${shopZone}`;
                let rateObj = deliveryRates[key1] || deliveryRates[key2];
                if (rateObj) {
                    deliveryFee = rateObj[service] || 3000;
                } else {
                    deliveryFee = 4000;
                }
            }
            let totalAmount = subtotal + deliveryFee;

            let orderData = {
                name: name,
                phone: phone,
                ward: ward,
                service: service,
                address: address,
                items: Object.values(cart).map(i => `${i.ItemName} (${i.Price}x${i.qty})`),
                total: totalAmount
            };

            try {
                let response = await fetch(API_URL, {
                    method: "POST",
                    body: JSON.stringify(orderData)
                });
                let result = await response.json();
                if (result.status === "success") {
                    alert("အော်ဒါအောင်မြင်စွာ တင်ပြီးပါပြီ!");
                    location.reload();
                } else {
                    alert("အော်ဒါတင်ရာတွင် အမှားအယွင်းရှိပါသည်: " + result.message);
                }
            } catch (err) {
                console.error(err);
                alert("ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။");
            }
        }

        fetchData();
    </script>
</body>
</html>
