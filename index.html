<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phyo Deli - Order App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 pb-24">

    <!-- Header -->
    <header class="bg-red-600 text-white p-4 text-center font-bold text-lg shadow-md">
        🍔 Phyo Deli Order App
    </header>

    <div class="p-4 max-w-md mx-auto">
        <!-- 1. Menu List Section -->
        <h2 class="font-bold text-md mb-3">ရနိုင်သော မီနူးများ</h2>
        <div id="product-list" class="grid grid-cols-2 gap-3 mb-6">
            <!-- Products will load here dynamically -->
        </div>

        <!-- 2. Address & Delivery Selection -->
        <div class="bg-white p-4 rounded-lg shadow-sm mb-4">
            <label class="block font-semibold mb-1">သင့်ရပ်ကွက်ကို ရွေးပါ</label>
            <select id="ward-select" class="w-full p-2 border rounded-md mb-3">
                <option value="">ရပ်ကွက် ရွေးပါ...</option>
            </select>

            <label class="block font-semibold mb-1">ပို့ဆောင်မည့် အမျိုးအစား</label>
            <select id="service-select" class="w-full p-2 border rounded-md">
                <option value="ရပ်ကွက်ထဲပဲပို့ (ပုံမှန်ပို့)">ရပ်ကွက်ထဲပဲပို့ (ပုံမှန်ပို့)</option>
                <option value="အမြန်ပို့">အမြန်ပို့ (Express)</option>
                <option value="တစ်ဇုန်ကျော် အမြန်ပို့">တစ်ဇုန်ကျော် အမြန်ပို့</option>
            </select>
        </div>
    </div>

    <!-- Footer / Cart Summary -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t p-4 shadow-lg max-w-md mx-auto flex justify-between items-center">
        <div>
            <p class="text-sm text-gray-500">စုစုပေါင်းကျသင့်ငွေ</p>
            <p id="total-price" class="font-bold text-lg text-red-600">0 ကျပ်</p>
        </div>
        <button onclick="submitOrder()" class="bg-green-600 text-white px-6 py-2 rounded-lg font-bold shadow hover:bg-green-700">
            အော်ဒါတင်မည်
        </button>
    </div>

    <script>
        // သင့်ရဲ့ Apps Script Web App URL ကို ဒီနေရာမှာ ထည့်ပါ
        const API_URL = "https://script.google.com/macros/s/AKfycbxzcULJEg-U16GtNNAf538KFyqL5O42C-yY0L6WVB7hR3mrK6fcqmg2DN_B0FB6amS-ew/exec"; 

        let products = [];
        let wards = [];
        let rates = [];
        let cart = []; // ခြင်းတောင်းထဲရှိ ပစ္စည်းများ သိမ်းဆည်းရန်

        // Data တွေ လှမ်းဆွဲခြင်း
        async function fetchData() {
            try {
                // Products ဆွဲရန်
                let resProd = await fetch(API_URL);
                let dataProd = await resProd.json();
                products = dataProd.products || [];
                renderProducts();

                // Zones & Rates ဆွဲရန်
                let resZones = await fetch(API_URL + "?action=zones");
                let dataZones = await resZones.json();
                wards = dataZones.wards || [];
                rates = dataZones.rates || [];
                renderWards();
            } catch (err) {
                console.error("Error loading data:", err);
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="bg-white p-3 rounded-lg shadow-sm border flex flex-col justify-between">
                    <img src="${p.ImageURL}" class="w-full h-28 object-cover rounded-md mb-2">
                    <h3 class="font-semibold text-sm">${p.ItemName}</h3>
                    <p class="text-red-600 font-bold text-sm mb-2">${p.Price} ကျပ်</p>
                    <button onclick="addToCart('${p.ItemID}')" class="bg-red-500 text-white py-1 text-xs rounded font-medium hover:bg-red-600">ထည့်မည်</button>
                </div>
            `).join('');
        }

        function renderWards() {
            const select = document.getElementById('ward-select');
            select.innerHTML = '<option value="">ရပ်ကွက် ရွေးပါ...</option>' + 
                wards.map(w => `<option value="${w.Ward_Name}">${w.Ward_Name} (${w.Zone_ID})</option>`).join('');
        }

        // ပစ္စည်းကို Cart ထဲ ထည့်သွင်းခြင်း
        function addToCart(itemID) {
            const product = products.find(p => p.ItemID == itemID);
            if (product) {
                cart.push(product);
                updateCartTotal();
                alert(product.ItemName + " ကို ခြင်းတောင်းထဲ ထည့်ပြီးပါပြီ။");
            }
        }

        // စုစုပေါင်းငွေ တွက်ချက်ပြသခြင်း
        function updateCartTotal() {
            let total = cart.reduce((sum, item) => sum + Number(item.Price), 0);
            document.getElementById('total-price').innerText = total.toLocaleString() + " ကျပ်";
        }

        function submitOrder() {
            const selectedWard = document.getElementById('ward-select').value;
            if(!selectedWard) {
                alert("ကျေးဇူးပြု၍ ရပ်ကွက်ရွေးချယ်ပါ");
                return;
            }
            if(cart.length === 0) {
                alert("ကျေးဇူးပြု၍ မီနူးပစ္စည်း အနည်းဆုံး တစ်ခု ရွေးချယ်ပါ");
                return;
            }
            alert("အော်ဒါအောင်မြင်စွာ တင်ပြီးပါပြီ!");
        }

        fetchData();
    </script>
</body>
</html>
